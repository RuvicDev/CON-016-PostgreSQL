[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-postgresql-connector"
version = "1.0.0"
description = "Conector Ruvic de solo lectura para PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1,<4.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_postgresql_connector*"]
